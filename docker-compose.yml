services:
  mysql:
    image: mysql:8.0
    container_name: canal-demo-mysql
    restart: unless-stopped
    # 宿主机 3306 已被本机 MySQL 占用，映射到 3307
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Shanghai
    volumes:
      - ./docker/mysql/conf:/etc/mysql/conf.d:ro
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  canal-server:
    image: canal/canal-server:v1.1.8
    container_name: canal-demo-canal
    restart: unless-stopped
    ports:
      - "11111:11111"
    environment:
      TZ: Asia/Shanghai
    volumes:
      # 容器内通过 compose 网络连 MySQL 服务名，地址为 mysql:3306
      - ./docker/canal/instance.properties:/home/admin/canal-server/conf/example/instance.properties:ro
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
